<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <linearGradient id="tile-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="card-back" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card-front" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="wallet-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b0e1a" flood-opacity="0.35"/>
    </filter>
    <clipPath id="above-wallet">
      <rect x="0" y="0" width="1024" height="452"/>
    </clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#2e354f" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile-light)"/>

  <g clip-path="url(#above-wallet)">
    <g transform="rotate(-10 430 360)">
      <rect x="268" y="236" width="350" height="226" rx="28" fill="url(#card-back)"/>
      <rect x="268" y="292" width="350" height="34" fill="#0f172a" fill-opacity="0.28"/>
    </g>
    <g transform="rotate(8 600 360)">
      <rect x="420" y="250" width="350" height="226" rx="28" fill="url(#card-front)"/>
      <rect x="456" y="296" width="70" height="52" rx="12" fill="#ffffff" fill-opacity="0.9"/>
      <rect x="456" y="376" width="190" height="16" rx="8" fill="#ffffff" fill-opacity="0.55"/>
    </g>
  </g>

  <g filter="url(#wallet-shadow)">
    <rect x="232" y="420" width="560" height="380" rx="70" fill="#ffffff"/>
    <rect x="600" y="536" width="232" height="150" rx="56" fill="#ffffff"/>
  </g>
  <rect x="232" y="420" width="560" height="64" rx="32" fill="#e7eaf3"/>
  <rect x="600" y="536" width="232" height="150" rx="56" fill="none" stroke="#e1e5f0" stroke-width="6"/>
  <circle cx="690" cy="611" r="26" fill="#2e354f"/>
</svg>
