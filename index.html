<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#090b11">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WE Budget">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>WE Budget</title>
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div id="phone-app" class="phone" hidden></div>
  <div id="app-container">
    <aside>
      <div class="logo-container">
        <div class="logo-icon">
          <img src="./white-eagles-logo-white.webp" alt="White Eagles" width="26" height="26">
        </div>
        <div>
          <span class="logo-text">WE Budget</span>
          <span class="logo-sub">White Eagles</span>
        </div>
      </div>

      <nav id="main-nav">
        <a class="nav-item" data-view="overview"><i data-lucide="layout-dashboard"></i><span data-i18n="nav-overview"></span></a>
        <a class="nav-item" data-view="month"><i data-lucide="calendar-days"></i><span data-i18n="nav-month"></span></a>
        <a class="nav-item" data-view="accounts"><i data-lucide="wallet"></i><span data-i18n="nav-accounts"></span></a>
        <a class="nav-item" data-view="templates"><i data-lucide="repeat"></i><span data-i18n="nav-templates"></span></a>
        <a class="nav-item" data-view="settings"><i data-lucide="settings"></i><span data-i18n="nav-settings"></span></a>
      </nav>

      <button class="btn btn-primary quick-add-btn" id="quick-add-btn" type="button">
        <i data-lucide="plus"></i><span data-i18n="quick-add"></span>
      </button>

      <button type="button" id="sync-status" class="sync-status" hidden></button>

      <div class="sidebar-footer">
        WE Budget <span id="app-version"></span><br>
        <a href="https://whiteeagles.sk/" target="_blank" rel="noopener">White Eagles &amp; Co. s.r.o.</a>
      </div>
    </aside>

    <main>
      <div id="sync-banner" class="sync-banner" role="alert" hidden></div>
      <div id="update-banner" class="update-banner" role="status" hidden></div>
      <section id="view-overview" class="view-panel"></section>
      <section id="view-month" class="view-panel"></section>
      <section id="view-accounts" class="view-panel"></section>
      <section id="view-templates" class="view-panel"></section>
      <section id="view-settings" class="view-panel"></section>
      <section id="view-welcome" class="view-panel"></section>
    </main>

    <footer class="promo-footer">
      <div class="promo-content">
        <span class="promo-badge">White Eagles</span>
        <span class="promo-text">
          <span data-i18n="footer-promo"></span>
          <a href="https://whiteeagles.sk/" target="_blank" rel="noopener"><span data-i18n="footer-visit"></span> <i data-lucide="external-link"></i></a>
        </span>
      </div>
      <div class="promo-copyright">&copy; <span id="current-year"></span> White Eagles &amp; Co. s.r.o. <span data-i18n="footer-rights"></span></div>
    </footer>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
